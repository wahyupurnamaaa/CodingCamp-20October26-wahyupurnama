<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="site-header">
    <div class="header-left">
      <p class="greeting" id="greeting">Good morning!</p>
      <p class="datetime" id="clock">--:--:--</p>
      <p class="datetime" id="dateline">Loading date…</p>
    </div>

    <div class="header-right">
      <div class="name-setting">
        <label for="input-name" class="sr-only">Your name</label>
        <input
          type="text"
          id="input-name"
          class="input-name"
          placeholder="Enter your name…"
          maxlength="40"
          autocomplete="off"
        />
      </div>
      <button
        id="btn-theme"
        class="btn btn-icon"
        aria-label="Toggle dark mode"
        title="Toggle light / dark mode"
      >
        <span id="theme-icon" aria-hidden="true">🌙</span>
      </button>
    </div>
  </header>

  <!-- ===== MAIN GRID ===== -->
  <main class="dashboard-grid">

    <!-- ── TO-DO LIST ── -->
    <section class="card card-todo" aria-labelledby="todo-heading">
      <h2 id="todo-heading" class="card-title">📋 To-Do List</h2>

      <form id="form-todo" class="input-row" novalidate>
        <label for="input-todo" class="sr-only">New task</label>
        <input
          type="text"
          id="input-todo"
          class="input-text"
          placeholder="Add a new task…"
          maxlength="200"
          autocomplete="off"
        />
        <button type="submit" class="btn btn-primary">Add</button>
      </form>
      <p id="todo-error" class="error-msg" role="alert" aria-live="polite"></p>

      <ul id="todo-list" class="todo-list" aria-label="Task list"></ul>
      <p id="todo-empty" class="empty-msg" aria-live="polite">No tasks yet — add one above!</p>
    </section>

    <!-- ── FOCUS TIMER ── -->
    <section class="card card-timer" aria-labelledby="timer-heading">
      <h2 id="timer-heading" class="card-title">⏱ Focus Timer</h2>

      <div class="timer-display" aria-live="polite" aria-label="Timer">
        <span id="timer-value">25:00</span>
      </div>

      <p id="timer-done-msg" class="timer-done" role="status" aria-live="polite" hidden>
        🎉 Session complete!
      </p>

      <div class="timer-controls">
        <button id="btn-start" class="btn btn-primary">Start</button>
        <button id="btn-stop"  class="btn btn-secondary" disabled>Stop</button>
        <button id="btn-reset" class="btn btn-secondary">Reset</button>
      </div>

      <form id="form-pomodoro" class="input-row pomodoro-row" novalidate>
        <label for="input-minutes" class="label-inline">Duration (min):</label>
        <input
          type="number"
          id="input-minutes"
          class="input-number"
          min="1"
          max="180"
          step="1"
          value="25"
        />
        <button type="submit" class="btn btn-secondary">Set</button>
      </form>
      <p id="pomodoro-error" class="error-msg" role="alert" aria-live="polite"></p>
    </section>

    <!-- ── QUICK LINKS ── -->
    <section class="card card-links" aria-labelledby="links-heading">
      <h2 id="links-heading" class="card-title">🔗 Quick Links</h2>

      <form id="form-link" class="input-row link-form" novalidate>
        <label for="input-link-name" class="sr-only">Link label</label>
        <input
          type="text"
          id="input-link-name"
          class="input-text"
          placeholder="Label"
          maxlength="60"
          autocomplete="off"
        />
        <label for="input-link-url" class="sr-only">URL</label>
        <input
          type="url"
          id="input-link-url"
          class="input-text"
          placeholder="https://example.com"
          maxlength="2000"
          autocomplete="off"
        />
        <button type="submit" class="btn btn-primary">Add</button>
      </form>
      <p id="link-error" class="error-msg" role="alert" aria-live="polite"></p>

      <ul id="links-list" class="links-list" aria-label="Quick links"></ul>
      <p id="links-empty" class="empty-msg" aria-live="polite">No links yet — add one above!</p>
    </section>

  </main>

  <!-- ===== EDIT TASK MODAL ===== -->
  <div
    id="edit-modal"
    class="modal-overlay"
    role="dialog"
    aria-modal="true"
    aria-labelledby="edit-modal-title"
    hidden
  >
    <div class="modal-box">
      <h3 id="edit-modal-title" class="modal-title">Edit Task</h3>
      <label for="edit-input" class="sr-only">Task text</label>
      <input
        type="text"
        id="edit-input"
        class="input-text"
        maxlength="200"
        autocomplete="off"
      />
      <p id="edit-error" class="error-msg" role="alert" aria-live="polite"></p>
      <div class="modal-actions">
        <button id="btn-edit-save"   class="btn btn-primary">Save</button>
        <button id="btn-edit-cancel" class="btn btn-secondary">Cancel</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
